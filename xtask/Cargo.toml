[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
# Dev-only automation crate (the `cargo xtask` pattern). Never published or
# shipped; it regenerates the checked-in `dist/` completions + man pages.
publish = false

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap = { workspace = true }
clap_complete.workspace = true
clap_mangen.workspace = true
# `teregen-login`: reads oscrc credentials via `[obs] api_url`.
mtui-config.workspace = true
# The two binaries' top-level clap parsers, reached via the auto-derived
# `CommandFactory` (`Args::command()` / `McpArgs::command()`). `mtui-mcp` is
# pulled without its `mcp` feature so the MCP server graph (rmcp/axum) stays out
# of a `-p xtask` build; only the ungated `args` module is used. A
# `--workspace` build still unifies the root facade's `mcp` feature onto it,
# since Cargo features are additive across the resolve graph.
mtui-core.workspace = true
mtui-datasources.workspace = true
mtui-mcp = { workspace = true }
# `corpus-survey`: reuses mtui's own HTTP client/TLS-verify policy and
# URL-sanitising error types instead of a second HTTP stack — the cost is
# pulling tokio's runtime into this crate.
mtui-types.workspace = true
# `teregen-login`: issues the authenticated GET /schema probe directly
# (mtui-datasources's HttpClient::inner() is crate-private) and renders the
# cached token's age.
reqwest.workspace = true
# `schema-check`: compares the live /api/v2/schema against the committed copy
# by value.
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
# Offline generation smoke test writes into an isolated temp dir (never `dist/`).
tempfile = "3"

[lints]
workspace = true
