---
name: cargo-deny
on:
  pull_request:
  schedule:
    # Advisories move independently of the code; a newly published advisory
    # must not turn an unrelated PR red, so it runs on its own schedule.
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  advisories:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: cargo-deny (advisories)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@d8395c1c8c9df74d968a3bcbba5533e396ff43cf  # v2.0.9
        with:
          command: check
          command-arguments: advisories
  bans-sources-licenses:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: cargo-deny (bans, sources, licenses)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@d8395c1c8c9df74d968a3bcbba5533e396ff43cf  # v2.0.9
        with:
          command: check
          command-arguments: bans sources licenses
