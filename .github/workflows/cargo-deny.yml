---
name: cargo-deny
# Installed directly rather than via EmbarkStudios/cargo-deny-action: that
# action's Docker image bakes in cargo-deny 0.18.0, whose bundled spdx crate
# rejects the "-or-later"/"-only" SPDX suffix in `licenses.allow` entries
# outright (a hard config-parse error, not a lint finding).
on:
  pull_request:
  schedule:
    # Advisories move independently of the code; a newly published advisory
    # must not turn an unrelated PR red, so it runs on its own schedule.
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  advisories:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: cargo-deny (advisories)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833  # v2.87.1
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check advisories
  bans-sources-licenses:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: cargo-deny (bans, sources, licenses)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833  # v2.87.1
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check bans sources licenses
