---
name: release
# yamllint disable-line rule:truthy
on:
  push:
    tags:
      # Version tags: 26.0.1, optionally with a pre-release suffix
      # (26.0.1rc1). The project tags without a "v" prefix.
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Build every platform even if one fails, so a single broken target
      # surfaces on its own. The release job needs all legs to succeed, so a
      # failure still blocks publishing a partial set of artifacts.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest  # Apple Silicon
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release is published with `gh release create` using
          # ${{ github.token }} in a separate job; no git push happens here, so
          # the checkout does not need a credential left behind in .git/config.
          persist-credentials: false

      - name: Install Rust toolchain
        # Pin a commit from the action's master branch (commits of the
        # toolchain branches are garbage-collected upstream) and select the
        # toolchain via the input instead of the ref.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: stable
      # No cargo cache here: releases are built hermetically so restored
      # build state can never influence published artifacts.

      - name: Verify tag matches workspace version
        shell: bash
        run: |
          pkg="$(sed -n 's/^version = "\(.*\)".*/\1/p' Cargo.toml | head -1)"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' != workspace version '$pkg'"
            exit 1
          fi

      - name: Add Rust target
        run: rustup target add "${{ matrix.target }}"

      # musl is Linux-only; the macOS leg builds natively for aarch64-apple-darwin.
      - name: Install musl tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # `--locked` so a release is built from the dependency versions committed
      # in Cargo.lock. Without it a newly published (or yanked-and-replaced)
      # transitive crate could differ from anything CI ever tested.
      - name: Build release binaries
        run: cargo build --release --locked --target "${{ matrix.target }}"

      # xtask stages the two binaries with completions/man/terms/vim-plugin from
      # dist/ and writes a `sha256sum -c`-compatible checksum (sha256sum on Linux,
      # shasum -a 256 on macOS) into dist/release/.
      - name: Package release tarball
        run: cargo xtask package --version "$GITHUB_REF_NAME" --target "${{ matrix.target }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

  release:
    # Publish only after every platform built successfully, so a release never
    # ships a partial artifact set.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # required for `gh release create`
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # Needed only for the tag list that picks the release-notes base below.
      # `fetch-depth: 0` because a shallow clone carries no tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: repo
          persist-credentials: false

      # Pick the previous release tag explicitly.
      #
      # `--generate-notes` alone asks GitHub to guess the base, and it guesses
      # wrong here: releases are cut on per-minor branches (26.0.x, 26.1.x)
      # that fork from main and are never merged back, so consecutive release
      # tags are *siblings* rather than ancestors. Finding no previous release
      # in the tag's own ancestry, GitHub falls back to the start of the
      # repository — which is why 26.1.1's notes re-listed the entire Python
      # era back to PR #72.
      #
      # Ordering by version rather than by ancestry is what makes this work
      # across sibling branches. An empty result means this is the first
      # release, and generating from the repository root is then correct.
      - name: Resolve the release-notes base tag
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          # An explicit walk rather than `grep -B1`: the step runs under
          # `bash -e`, where a grep that matches nothing exits 1 and would fail
          # the release. This cannot fail, and yields an empty base for the
          # oldest tag — the first-release case, where generating from the
          # repository root is correct.
          prev=""
          while read -r tag; do
            [ "$tag" = "$GITHUB_REF_NAME" ] && break
            prev="$tag"
          done < <(git tag --list '[0-9]*.[0-9]*.[0-9]*' | sort -V)
          echo "NOTES_START_TAG=$prev" >> "$GITHUB_ENV"
          echo "release-notes base: ${prev:-<repository root: first release>}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          args=(--title "$GITHUB_REF_NAME" --generate-notes)
          if [ -n "$NOTES_START_TAG" ]; then
            args+=(--notes-start-tag "$NOTES_START_TAG")
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" dist/*
