---
name: ci
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PR runs are cancelled by a newer push; a main/tag run must finish
  # so its Codecov upload lands (PR comparisons need the main baseline).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  fmt:
    runs-on: ubuntu-latest
    name: MTUI format
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
  clippy:
    runs-on: ubuntu-latest
    name: MTUI lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install clippy
        run: rustup component add clippy
      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
  docs:
    runs-on: ubuntu-latest
    name: MTUI docs
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check rustdoc (warnings as errors)
        run: cargo doc --workspace --no-deps --all-features --document-private-items
  feature-matrix:
    runs-on: ubuntu-latest
    name: MTUI feature matrix (compile-only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build with no default features
        run: cargo build --workspace --no-default-features
      - name: Build with all features
        run: cargo build --workspace --all-features
  test:
    runs-on: ubuntu-latest
    name: MTUI tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The SSH integration suite authenticates the client from an identity file;
      # the in-process fixture accepts any key but the runner ships none. Generate
      # a throwaway ed25519 key so the pubkey path is exercised.
      - name: SSH fixture
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
      # `svn` is a runtime dependency; a few tests drive a local file:// repo and
      # skip cleanly when absent, so install it to keep those paths covered.
      - name: SVN fixture
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion
      - name: Build tests
        run: cargo build --workspace
      - name: Run tests (default features)
        run: cargo test --workspace
      # mtui-mcp's server/transport tests are gated behind `-F mcp`, so the
      # default workspace test run never exercises them.
      - name: Run mtui-mcp tests
        run: cargo test -p mtui-mcp -F mcp
  macos:
    runs-on: macos-latest
    name: MTUI macOS (Apple Silicon)
    # Portability early-warning on aarch64-apple-darwin: clippy + the test
    # suite (incl. the mcp-gated tests) so macOS stays viable for release
    # binaries. No fmt leg — formatting is platform-independent and covered by
    # the ubuntu `fmt` job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install clippy
        run: rustup component add clippy
      # The SSH integration suite authenticates from an identity file; the
      # in-process fixture accepts any key but the runner ships none. Generate a
      # throwaway ed25519 key so the pubkey path is exercised. (svn is omitted:
      # the file:// repo tests skip cleanly when it is absent.)
      - name: SSH fixture
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run tests (default features)
        run: cargo test --workspace
      - name: Run mtui-mcp tests
        run: cargo test -p mtui-mcp -F mcp
  beta:
    # Early warning on the upcoming compiler: never blocks, but surfaces
    # new-lint and regression noise before beta becomes stable. No fmt leg
    # (beta rustfmt formatting may legitimately drift).
    runs-on: ubuntu-latest
    name: MTUI beta toolchain (early warning)
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install beta toolchain
        run: rustup toolchain install beta --component clippy
      - name: Clippy (beta)
        run: cargo +beta clippy --workspace --all-targets --all-features -- -D warnings
      # Same fixture as the test job: the SSH integration suite authenticates
      # the client from an identity file and fails without one.
      - name: SSH fixture
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
      - name: Test (beta)
        run: cargo +beta test --workspace
  coverage:
    runs-on: ubuntu-latest
    name: MTUI coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: SSH fixture
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
      - name: SVN fixture
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion
      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov
        # SHA-pinned like every other action (Scorecard Pinned-Dependencies);
        # the tool is selected via the input, not the mutable `@cargo-llvm-cov`
        # tag alias.
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780  # v2.86.1
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage to CodeCov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
