---
name: ci
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PR runs are cancelled by a newer push; a main/tag run must finish
  # so its Codecov upload lands (PR comparisons need the main baseline).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  fmt:
    runs-on: ubuntu-latest
    name: MTUI format
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
  clippy:
    runs-on: ubuntu-latest
    name: MTUI lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install clippy
        run: rustup component add clippy
      # Shared with `docs`: both run --all-features and both consume
      # dependency metadata (`.rmeta` check artifacts / rustdoc JSON) rather
      # than fully-codegenned rlibs, so their target/ sets genuinely overlap.
      # The two race to save this key on `main`; the loser gets a 409 that
      # rust-cache logs as a warning, not a failure.
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: check-all-features
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
  docs:
    runs-on: ubuntu-latest
    name: MTUI docs
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Shared with `clippy` — see the comment on that job's cache step.
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: check-all-features
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check rustdoc (warnings as errors)
        run: cargo doc --workspace --no-deps --all-features --document-private-items
  feature-matrix:
    runs-on: ubuntu-latest
    name: MTUI feature matrix (compile-only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Its own key, not shared with `clippy`/`docs`: `cargo clippy` emits
      # `.rmeta` check artifacts that a real `cargo build` cannot link
      # against, so sharing would hand this job a hit that still forces full
      # codegen — a cache that looks like it works and does not.
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build with no default features
        run: cargo build --workspace --no-default-features
      - name: Build with all features
        run: cargo build --workspace --all-features
  test:
    runs-on: ubuntu-latest
    name: MTUI tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Full registry + target/ cache. This is the only job carrying it in
      # Phase A of the CI-caching plan, so its real compressed key size can be
      # measured before widening to other jobs.
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The SSH integration suite authenticates the client from an identity file;
      # the in-process fixture accepts any key but the runner ships none. Generate
      # a throwaway ed25519 key so the pubkey path is exercised.
      - name: SSH fixture
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
      # `svn` is a runtime dependency; a few tests drive a local file:// repo and
      # skip cleanly when absent, so install it to keep those paths covered.
      - name: SVN fixture
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion
      - name: Build tests
        run: cargo build --workspace
      - name: Run tests (default features)
        run: cargo test --workspace
  macos:
    runs-on: macos-latest
    name: MTUI macOS (Apple Silicon)
    # Portability early-warning on aarch64-apple-darwin: clippy + the test
    # suite so macOS stays viable for release binaries. No fmt leg —
    # formatting is platform-independent and covered by the ubuntu `fmt` job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install clippy
        run: rustup component add clippy
      # Full registry + target/ cache: Phase A measured ~581 MiB for the
      # `test` job's key, leaving ample budget (see plans/ci-caching.md) for
      # macOS's own key (runner.os already differs from the ubuntu jobs).
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The SSH integration suite authenticates from an identity file; the
      # in-process fixture accepts any key but the runner ships none. Generate a
      # throwaway ed25519 key so the pubkey path is exercised. (svn is omitted:
      # the file:// repo tests skip cleanly when it is absent.)
      - name: SSH fixture
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run tests (default features)
        run: cargo test --workspace
  beta:
    # Early warning on the upcoming compiler: never blocks, but surfaces
    # new-lint and regression noise before beta becomes stable. No fmt leg
    # (beta rustfmt formatting may legitimately drift).
    runs-on: ubuntu-latest
    name: MTUI beta toolchain (early warning)
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install beta toolchain
        run: rustup toolchain install beta --component clippy
      - name: Restore cargo registry cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - name: Clippy (beta)
        run: cargo +beta clippy --workspace --all-targets --all-features -- -D warnings
      # Same fixture as the test job: the SSH integration suite authenticates
      # the client from an identity file and fails without one.
      - name: SSH fixture
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
      - name: Test (beta)
        run: cargo +beta test --workspace
      - name: Save cargo registry cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
  coverage:
    runs-on: ubuntu-latest
    name: MTUI coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Restore cargo registry cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - name: SSH fixture
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
      - name: SVN fixture
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion
      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov
        # SHA-pinned like every other action (Scorecard Pinned-Dependencies);
        # the tool is selected via the input, not the mutable `@cargo-llvm-cov`
        # tag alias.
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518  # v2.86.5
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Save cargo registry cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
      - name: Upload coverage to CodeCov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
