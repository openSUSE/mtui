---
name: ci
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PR runs are cancelled by a newer push; a main/tag run must finish
  # so its Codecov upload lands (PR comparisons need the main baseline).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  fmt:
    runs-on: ubuntu-latest
    name: MTUI format
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
  clippy:
    runs-on: ubuntu-latest
    name: MTUI lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install clippy
        run: rustup component add clippy
      # Shared with `docs`: both run --all-features and both consume
      # dependency metadata (`.rmeta` check artifacts / rustdoc JSON) rather
      # than fully-codegenned rlibs, so their target/ sets genuinely overlap.
      # `clippy` is the key's sole writer (see `docs`'s `save-if: false`), so
      # there is no save race to warn about.
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: check-all-features
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
  docs:
    runs-on: ubuntu-latest
    name: MTUI docs
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Shared with `clippy` — see the comment on that job's cache step.
      # `RUSTDOCFLAGS` lives on the `cargo doc` step below, not this job's
      # `env:`, so rust-cache (which runs before it) never sees it and the
      # key genuinely collapses to the one `clippy` writes. `save-if: false`
      # makes `clippy` the sole writer: `cargo clippy --all-targets` produces
      # a superset of the dependency metadata rustdoc needs.
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: check-all-features
          save-if: false
      - name: Check rustdoc (warnings as errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -o pipefail
          cargo doc --workspace --no-deps --all-features --document-private-items --locked \
            2>&1 | tee "$RUNNER_TEMP/doc.log"
          ! grep -q 'output filename collision' "$RUNNER_TEMP/doc.log"
  feature-matrix:
    runs-on: ubuntu-latest
    name: MTUI feature matrix (compile-only)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Its own key, not shared with `clippy`/`docs`: `cargo clippy` emits
      # `.rmeta` check artifacts that a real `cargo build` cannot link
      # against, so sharing would hand this job a hit that still forces full
      # codegen — a cache that looks like it works and does not.
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build with no default features
        run: cargo build --workspace --no-default-features --locked
      - name: Build with all features
        run: cargo build --workspace --all-features --locked
  test:
    runs-on: ubuntu-latest
    name: MTUI tests + coverage
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Full registry + target/ cache, own key: `cargo-llvm-cov` builds under
      # instrumentation RUSTFLAGS into `target/llvm-cov-target`, sharing
      # nothing with the check-only `clippy`/`docs`/`feature-matrix` keys.
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The SSH integration suite authenticates the client from an identity file;
      # the in-process fixture accepts any key but the runner ships none. Generate
      # a throwaway ed25519 key so the pubkey path is exercised.
      - name: SSH fixture
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
      # `svn` is a runtime dependency; a few tests drive a local file:// repo and
      # skip cleanly when absent, so install it to keep those paths covered.
      - name: SVN fixture
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion
      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov
        # SHA-pinned like every other action (Scorecard Pinned-Dependencies);
        # the tool is selected via the input, not the mutable `@cargo-llvm-cov`
        # tag alias.
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518  # v2.86.5
        with:
          tool: cargo-llvm-cov
      # This is CI's only run of the test suite: `cargo llvm-cov` builds and
      # runs it once, instrumented, replacing the separate uninstrumented
      # `cargo test --workspace` that used to run here.
      - name: Generate coverage
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - name: Upload coverage to CodeCov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
  macos:
    runs-on: macos-latest
    name: MTUI macOS (Apple Silicon)
    timeout-minutes: 20
    # Portability early-warning on aarch64-apple-darwin: clippy + the test
    # suite so macOS stays viable for release binaries. No fmt leg —
    # formatting is platform-independent and covered by the ubuntu `fmt` job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install clippy
        run: rustup component add clippy
      # Full registry + target/ cache: Phase A measured ~581 MiB for the
      # `test` job's key, leaving ample budget (see plans/ci-caching.md) for
      # macOS's own key (runner.os already differs from the ubuntu jobs).
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The SSH integration suite authenticates from an identity file; the
      # in-process fixture accepts any key but the runner ships none. Generate a
      # throwaway ed25519 key so the pubkey path is exercised. (svn is omitted:
      # the file:// repo tests skip cleanly when it is absent.)
      - name: SSH fixture
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests (default features)
        run: cargo test --workspace --locked
  msrv:
    runs-on: ubuntu-latest
    name: MTUI MSRV (1.96)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e  # 1.96.0
      # Registry-only: the budget cannot afford another full `target/` key
      # for a toolchain that is otherwise identical to the `clippy`/`docs`
      # build. This job checks compile viability, not lint or test behavior.
      - name: Restore cargo registry cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - name: Check (MSRV)
        run: cargo +1.96 check --workspace --all-features --locked
      - name: Save cargo registry cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
