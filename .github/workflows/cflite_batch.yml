---
name: fuzz-batch
# Weekly deep fuzz. Batch mode is also what makes the corpus persist: it is the
# only mode here that uploads the `cifuzz-corpus-<target>` artifacts every
# code-change run already tries to download.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions: read-all

concurrency:
  # One batch run at a time: two would collide on the same corpus artifact name.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    # Nominal run is ~67 min; the headroom is for the crash path, which
    # re-runs each reproducer before the crash artifacts are uploaded.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          language: rust
          sanitizer: ${{ matrix.sanitizer }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Per-target floor, not a job cap: 3600s / 5 targets => >=12 min each.
          fuzz-seconds: 3600
          mode: batch
          sanitizer: ${{ matrix.sanitizer }}
