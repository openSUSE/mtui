---
name: dependency-review
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  # Write only so the action can post its summary comment on the PR.
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    # Block PRs that add a vulnerable dependency before merge. Complements
    # Dependabot, which only alerts once the code is already on main.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        # Licence policy now lives entirely in deny.toml (cargo-deny gates it
        # across the whole tree, not just the PR delta); this job is left to
        # vulnerability severity only.
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec  # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
