---
name: container
# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]
    tags:
      # Same version-tag grammar as release.yml; the project tags without
      # a "v" prefix.
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - 'crates/**'
      - 'src/**'
      - 'xtask/**'
      - .github/workflows/container.yml
      - .github/scripts/container-structure-test.sh
  workflow_dispatch:

permissions:
  contents: read

# As in ci.yml: only PR runs cancel on re-push; a main/tag run must finish so
# its push, signature and attestation land.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: container structure test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Container structure test
        shell: bash
        run: bash .github/scripts/container-structure-test.sh Dockerfile

  build:
    name: build image (${{ matrix.arch }})
    needs: [test]
    strategy:
      # One leg per arch, each on its native runner.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    # Native compile per arch.
    timeout-minutes: 60
    permissions:
      contents: read
      # Push of this arch's image by digest.
      packages: write
    # Publish only from real publishes in the upstream repo: main-branch and
    # tag pushes. workflow_dispatch (any branch) and PRs stay build-only, as
    # in release.yml. The repository guard keeps a fork's `main` push from
    # failing against ghcr.io/opensuse/mtui with the fork's token.
    env:
      PUSH_IMAGE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.repository == 'openSUSE/mtui' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # PR and dispatched builds stay build-only: no registry login, no push,
      # no digest. (Gated on PUSH_IMAGE, not merely != PR, so a dispatch from
      # a feature branch cannot push an untagged digest.)
      - name: Log in to ghcr.io
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          # Lowercase: registry references reject the `openSUSE` capitalisation.
          images: ghcr.io/opensuse/mtui
          # `latest=false`: the implicit auto-latest fires for every semver
          # tag event — including `-rc` prereleases — and would duplicate the
          # explicit raw `latest` below on GA tags. `latest` is managed
          # explicitly and GA-only.
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            # The X.Y float tracks GA releases only, like `latest`.
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-') }}
            # `latest` tracks GA releases only: a `-rc` tag must not move it.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-') }}

      # Publish leg: compile natively for this arch and push by digest. Tags
      # are applied once in the merge job, never here.
      - name: Build and push by digest
        if: env.PUSH_IMAGE == 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/opensuse/mtui,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BUILD_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
            BUILD_REVISION=${{ github.sha }}
          # Per-arch scope: the legs share one GHA cache namespace.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          # SLSA provenance records the resolved base digests as materials;
          # the merge job surfaces the index digests in its summary.
          provenance: true

      # Build-only leg: the same native compile, pushed nowhere.
      - name: Build only
        if: env.PUSH_IMAGE != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false

      - name: Export digest
        if: env.PUSH_IMAGE == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          digest="$DIGEST"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then echo "::error::invalid digest '${digest:-<empty>}'" >&2; exit 1; fi
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.PUSH_IMAGE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge and publish manifest
    needs: [build]
    # Manifest assembly runs only on real publishes; PR/dispatch legs pushed
    # no digest, so there is nothing to merge.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.repository == 'openSUSE/mtui'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Manifest-list push to ghcr.io.
      packages: write
      # Cosign keyless signing + GitHub provenance attestation.
      id-token: write
      attestations: write
    env:
      # Same publish gate as the build legs (this job's `if:` above already
      # enforces it); the mirror steps add HAS_OBS_CREDS.
      PUSH_IMAGE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.repository == 'openSUSE/mtui' }}
      HAS_OBS_CREDS: ${{ secrets.OBS_REGISTRY_USERNAME != '' && secrets.OBS_REGISTRY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/opensuse/mtui
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-') }}

      # One manifest list over the per-arch digests; its digest is the single
      # subject for the signature and attestations below. The digest is read
      # back from the registry, never parsed from create's progress text.
      - name: Merge and push manifest
        id: merge
        env:
          TAGS_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          shopt -s nullglob
          files=( [0-9a-f]* )
          if [ "${#files[@]}" -eq 0 ]; then echo "::error::no digest files in /tmp/digests" >&2; exit 1; fi
          first_tag="$(jq -r '.tags[0]' <<< "$TAGS_JSON")"
          if [ -z "$first_tag" ] || [ "$first_tag" = "null" ]; then echo "::error::no tags from metadata" >&2; exit 1; fi
          # shellcheck disable=SC2046
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$TAGS_JSON") $(printf 'ghcr.io/opensuse/mtui@sha256:%s ' "${files[@]}")
          # The new list may need a moment to propagate; retry the read.
          merged=""
          for _ in 1 2 3 4 5; do
            merged="$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -r .digest)" || true
            if [ -n "$merged" ] && [ "$merged" != "null" ]; then break; fi
            sleep 5
          done
          if [ -z "$merged" ] || [ "$merged" = "null" ]; then echo "::error::could not determine merged digest" >&2; exit 1; fi
          echo "digest=$merged" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      # A signature attaches to the digest, so one sign covers every tag.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "ghcr.io/opensuse/mtui@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/opensuse/mtui
          subject-digest: ${{ steps.merge.outputs.digest }}

      # Mirror the ghcr.io manifest list to registry.opensuse.org tag-for-tag.
      # One merge, so both registries serve the identical digest; `imagetools
      # create` copies the manifest without rebuilding. Needs the
      # OBS_REGISTRY_USERNAME / OBS_REGISTRY_PASSWORD repository secrets; while
      # they are unset these steps (and only these steps) are skipped so main
      # stays green before the mirror is wired up.
      - name: Log in to registry.opensuse.org
        if: env.PUSH_IMAGE == 'true' && env.HAS_OBS_CREDS == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: registry.opensuse.org
          username: ${{ secrets.OBS_REGISTRY_USERNAME }}
          password: ${{ secrets.OBS_REGISTRY_PASSWORD }}

      - name: Mirror to registry.opensuse.org
        if: env.PUSH_IMAGE == 'true' && env.HAS_OBS_CREDS == 'true'
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            mirror="${tag/ghcr.io\/opensuse/registry.opensuse.org\/opensuse}"
            docker buildx imagetools create -t "$mirror" "ghcr.io/opensuse/mtui@${DIGEST}"
          done <<< "$TAGS"
          cosign sign --yes "registry.opensuse.org/opensuse/mtui@${DIGEST}"

      # The mirror serves the identical digest, so the same build provenance
      # holds for it; attest under its own subject name.
      - name: Attest mirror provenance
        if: env.PUSH_IMAGE == 'true' && env.HAS_OBS_CREDS == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: registry.opensuse.org/opensuse/mtui
          subject-digest: ${{ steps.merge.outputs.digest }}

      # Base FROM lines float on tags (see Dockerfile): this step only
      # re-resolves them at merge time for the run summary, so it can differ
      # from what the legs pulled when a tag rolls mid-run. Build-time truth
      # is the per-arch BuildKit provenance, which already lists the resolved
      # base digests as materials; the digests below are informational only.
      # Informational means non-failing: a resolution miss warns but never
      # turns an already-published run red.
      - name: Record base digests
        continue-on-error: true
        run: |
          set -euo pipefail
          mapfile -t bases < <(grep -Ei '^[[:space:]]*FROM[[:space:]]+' Dockerfile | awk '{for (i = 2; i <= NF; i++) if ($i !~ /^--/) {print $i; next}}')
          {
            echo "Base digests resolved at merge time (informational; build-time truth is the SLSA materials):";
            for base in "${bases[@]}"; do
              digest="$(docker buildx imagetools inspect "$base" --format '{{json .Manifest}}' | jq -r .digest)" || true
              if [ -z "$digest" ] || [ "$digest" = "null" ]; then echo "::warning::could not resolve base digest for ${base}" >&2; continue; fi
              echo "- ${base} @ ${digest}";
            done;
          } >> "$GITHUB_STEP_SUMMARY"
