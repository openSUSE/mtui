---
name: container
# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]
    tags:
      # Same version-tag grammar as release.yml; the project tags without
      # a "v" prefix.
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    paths:
      - Containerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - 'crates/**'
      - 'src/**'
      - 'xtask/**'
      - .github/workflows/container.yml
      - .github/scripts/container-structure-test.sh
  workflow_dispatch:

permissions:
  contents: read

# As in ci.yml: only PR runs cancel on re-push; a main/tag run must finish so
# its push, signature and attestation land.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: container structure test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Container structure test
        shell: bash
        run: bash .github/scripts/container-structure-test.sh Containerfile

  build:
    name: build and push container image
    needs: [test]
    runs-on: ubuntu-latest
    # QEMU arm64 release build hit the old 90-minute ceiling (run 41186681547);
    # the gha layer cache below makes repeat runs incremental.
    timeout-minutes: 240
    permissions:
      contents: read
      # ghcr.io push.
      packages: write
      # cosign keyless signing + GitHub provenance attestation.
      id-token: write
      attestations: write
    # Publish only from real publishes: main-branch and tag pushes.
    # workflow_dispatch (any branch) and PRs stay build-only, as in release.yml.
    env:
      PUSH_IMAGE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
      # The `secrets` context is not available in step `if:`, so mirror
      # credential presence is mapped here (job-level `env:` allows it) and
      # the mirror steps gate on `env.HAS_OBS_CREDS`. A presence flag, not
      # the password itself, so the secret reaches only the login step.
      HAS_OBS_CREDS: ${{ secrets.OBS_REGISTRY_USERNAME != '' && secrets.OBS_REGISTRY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # PR and dispatched builds stay build-only: no registry login, no push,
      # no signing. (Gated on PUSH_IMAGE, not merely != PR, so a dispatch from
      # a feature branch cannot push an untagged manifest.)
      - name: Log in to ghcr.io
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          # Lowercase: registry references reject the `openSUSE` capitalisation.
          images: ghcr.io/opensuse/mtui
          # `latest=false`: the implicit auto-latest fires for every semver
          # tag event — including `-rc` prereleases — and would duplicate the
          # explicit raw `latest` below on GA tags. `latest` is managed
          # explicitly and GA-only.
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            # The X.Y float tracks GA releases only, like `latest`.
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-') }}
            # `latest` tracks GA releases only: a `-rc` tag must not move it.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Containerfile
          # Native cargo build per arch (see Containerfile); QEMU emulates
          # the arm64 leg on this runner.
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH_IMAGE == 'true' }}
          # Attestations ride on the pushed manifest, so build-only runs attest nothing.
          provenance: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: env.PUSH_IMAGE == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign the image
        if: env.PUSH_IMAGE == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "$TAGS"

      - name: Attest build provenance
        if: env.PUSH_IMAGE == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/opensuse/mtui
          subject-digest: ${{ steps.build.outputs.digest }}

      # Mirror the ghcr.io image to registry.opensuse.org tag-for-tag. One
      # build, so both registries serve the identical digest; `imagetools
      # create` copies the manifest without rebuilding. Needs the
      # OBS_REGISTRY_USERNAME / OBS_REGISTRY_PASSWORD repository secrets; while
      # they are unset these steps (and only these steps) are skipped so main
      # stays green before the mirror is wired up.
      - name: Log in to registry.opensuse.org
        if: env.PUSH_IMAGE == 'true' && env.HAS_OBS_CREDS == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: registry.opensuse.org
          username: ${{ secrets.OBS_REGISTRY_USERNAME }}
          password: ${{ secrets.OBS_REGISTRY_PASSWORD }}

      - name: Mirror to registry.opensuse.org
        if: env.PUSH_IMAGE == 'true' && env.HAS_OBS_CREDS == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            mirror="${tag/ghcr.io\/opensuse/registry.opensuse.org\/opensuse}"
            docker buildx imagetools create -t "$mirror" "${tag}@${DIGEST}"
            cosign sign --yes "${mirror}@${DIGEST}"
          done <<< "$TAGS"

      # The mirror serves the identical digest, so the same build provenance
      # holds for it; attest under its own subject name.
      - name: Attest mirror provenance
        if: env.PUSH_IMAGE == 'true' && env.HAS_OBS_CREDS == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: registry.opensuse.org/opensuse/mtui
          subject-digest: ${{ steps.build.outputs.digest }}
