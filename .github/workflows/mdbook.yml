---
name: mdbook
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but let main runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mdbook:
    # Unfiltered, like `typos`: this is precisely the check a docs-only PR
    # needs, so it must not inherit `ci.yml`'s paths-ignore.
    runs-on: ubuntu-latest
    name: MTUI mdBook
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install mdBook
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91  # v2.87.31
        with:
          tool: mdbook
      # taiki-e/install-action's manifest only carries the original
      # mdbook-linkcheck, which does not parse mdbook 0.5's RenderContext
      # JSON; this fork does. `cargo install` (not the manifest fallback)
      # keeps the version pin explicit and reproducible.
      - name: Install mdbook-linkcheck2
        run: cargo install mdbook-linkcheck2 --locked --version 0.13.0
      - name: Build book (renders HTML and checks internal links)
        run: mdbook build docs
      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'openSUSE/mtui'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'openSUSE/mtui'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/book/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'openSUSE/mtui'
    needs: mdbook
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
