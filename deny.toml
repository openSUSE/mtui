# cargo-deny configuration. Run locally with `cargo deny check`.
# CI: advisories run on a daily schedule (the advisory DB moves independently
# of the code, so a newly published advisory must not turn an unrelated PR
# red); bans/sources/licenses run on every pull request.

[graph]
# Matches ci.yml's `--all-features` builds, so this check sees the same
# dependency set as clippy/docs/feature-matrix.
all-features = true

# This section is considered when running `cargo deny check advisories`.
[advisories]
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "timing side-channel in rsa, pulled in transitively via russh's SSH key handling; no fix is available upstream, and the attack requires network-observable RSA signing timing, which does not apply to mtui's outbound-only SSH client role" },
]

# This section is considered when running `cargo deny check licenses`.
[licenses]
# mtui is licensed GPL-3.0-or-later — an intentional departure from the
# original Python implementation's GPL-2.0-only, adopted specifically because
# GPL-2.0-only cannot incorporate Apache-2.0-only code (russh, rmcp, ring),
# while GPL-3.0-or-later can per FSF guidance. The allow list below is
# therefore GPLv3-compatible permissive/weak-copyleft licenses plus
# GPL-3.0-or-later itself; anything else fails closed rather than being
# individually deny-listed.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-or-later",
]

# This section is considered when running `cargo deny check bans`.
[bans]
multiple-versions = "warn"

# This section is considered when running `cargo deny check sources`.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
