[package]
name = "mtui-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Integration tests are consolidated into a single `tests/it.rs` binary so the
# crate + its heavy deps (rmcp/axum under `--all-features`) link once, not once
# per file.
autotests = false

[lib]
name = "mtui_mcp"
path = "src/lib.rs"

# Perf baseline bench. Requires the `mcp` feature (the session +
# job model live behind it, on by default); `harness = false` -> criterion
# main. Run with `cargo bench -p mtui-mcp --bench mcp_jobs`.
[[bench]]
name = "mcp_jobs"
path = "benches/mcp_jobs.rs"
harness = false
required-features = ["mcp"]

# Contention measurement for different-RRID dispatch. Requires
# the `mcp` feature (on by default). Run with
# `cargo bench -p mtui-mcp --bench dispatch_concurrency`.
[[bench]]
name = "dispatch_concurrency"
path = "benches/dispatch_concurrency.rs"
harness = false
required-features = ["mcp"]

[[test]]
name = "it"
path = "tests/it.rs"

[lints]
workspace = true

[features]
default = ["mcp"]
# Gates the rmcp server so the root facade's `cli`-only build and the `mtui`
# REPL never drag in the MCP SDK. The stdio runner + tool synthesiser live
# behind this; the facade names it explicitly, so `-p mtui
# --no-default-features` genuinely drops it.
mcp = [
    "dep:rmcp",
    "dep:serde_json",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:axum",
    "dep:tokio-util",
    "dep:mtui-testreport",
    "dep:mtui-hosts",
    "dep:futures",
    "dep:base64ct",
]

[dependencies]
mtui-core.workspace = true
mtui-config.workspace = true
mtui-testreport = { workspace = true, optional = true }
# The post-abort unlock fan-out in `session.rs` classifies `LockOutcome`; the
# crate is already in the tree via `mtui-core`, so this adds no build cost.
mtui-hosts = { workspace = true, optional = true }
clap.workspace = true
anyhow.workspace = true
tokio.workspace = true
rmcp = { workspace = true, optional = true }
base64ct = { version = "1", features = ["alloc"], optional = true }
futures = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "test-util"] }
insta.workspace = true
serde_json.workspace = true
async-trait.workspace = true
clap.workspace = true
mtui-config.workspace = true
mtui-testreport.workspace = true
mtui-hosts.workspace = true
mtui-types.workspace = true
tokio-util = { workspace = true }
futures.workspace = true
tempfile = "3"
# Serialises the `$RUST_LOG` mutations in the `startup_filter` tests: the whole
# crate's tests share one process, so the env var is a process-global.
serial_test.workspace = true
# Perf baseline bench: MCP scoped-lock acquire/release contention.
criterion.workspace = true
