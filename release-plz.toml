# Release automation.
#
# release-plz opens a Release PR on `main` carrying the mechanical version
# bumps. The maintainer sets the release by editing that PR (version number,
# plus the `## [Unreleased]` → `## [X.Y.Z]` changelog rename); merging it makes
# release-plz tag the release and publish to crates.io. The tag push then
# drives `.github/workflows/release.yml`, which stays the only creator of
# GitHub releases (build matrix and notes-base walk untouched).
#
# Per-minor branches (`26.N.x`) get manual cherry-picks only: release-plz
# assumes a single release branch, so it never runs there. See
# docs/src/installation.md "Cutting a release (maintainers)".
[workspace]
# Publish only on Release-PR merges, never on direct `main` pushes.
release_always = false
# One tag per release, unprefixed (`26.4.1`, never `v26.4.1`): `_service`'s
# `versionrewrite` (`v?([0-9].*)`) and release.yml's `[0-9]+…` tag filter both
# key on this shape. Tagging is disabled workspace-wide and enabled for the
# facade crate only, so the lockstep-versioned crates share the one tag
# instead of each creating the same one.
git_tag_enable = false
# GitHub releases stay with release.yml's `gh release create`; release-plz
# must not take them over.
git_release_enable = false
# No API-break major bumps: the year-based line (`26.x`) is not semver, so a
# cargo-semver-checks finding must never propose `26` → `27`. Bumps follow
# the Release-PR edits alone (hand-fixing a `27` proposal reads as an edit
# and closes and recreates the PR).
semver_check = false
# The hand-written Keep-a-Changelog root file is the only changelog, and
# release-plz never writes it: the Release PR carries the mechanical version
# bumps alone, and the maintainer renames its `## [Unreleased]` section to
# `## [X.Y.Z] - <date>` with the curated entries before merging. Per-crate
# changelogs stay off too, so no generated section ever fights the
# hand-written one.
changelog_update = false

[[package]]
name = "suse-mtui"
git_tag_enable = true
git_tag_name = "{{ version }}"
changelog_update = false
# Lockstep line: every publishable crate ships the one workspace version.
# Computed from the shared `version.workspace` field today (release-plz takes
# the max across inheritors), so this only pins the intent — but if a crate
# ever drops the inheritance, the group still holds it in lockstep instead of
# diverging silently. `xtask` (`publish = false`) is intentionally outside it.
version_group = "mtui"

[[package]]
name = "mtui-cli"
version_group = "mtui"

[[package]]
name = "mtui-config"
version_group = "mtui"

[[package]]
name = "mtui-core"
version_group = "mtui"

[[package]]
name = "mtui-datasources"
version_group = "mtui"

[[package]]
name = "mtui-hosts"
version_group = "mtui"

[[package]]
name = "mtui-mcp"
version_group = "mtui"

[[package]]
name = "mtui-testreport"
version_group = "mtui"

[[package]]
name = "mtui-tui"
version_group = "mtui"

[[package]]
name = "mtui-types"
version_group = "mtui"
